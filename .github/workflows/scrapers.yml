name: scrapers

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  health:
    name: Scrapers — santé
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      - run: npx jest --config ./test/jest-e2e.json --runInBand "test/scrapers/(hellowork|jeunesdavenir|jtms|linkedin|wttj)"
      - run: npx jest --config ./test/jest-e2e.json --runInBand "test/scrapers/glassdoor"
        continue-on-error: true
