services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules
      - backend_generated:/app/generated
      - db_data:/app/data
    environment:
      DATABASE_URL: file:/app/data/dev.db
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  prisma-studio:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules
      - backend_generated:/app/generated
      - db_data:/app/data
    environment:
      DATABASE_URL: file:/app/data/dev.db
    ports:
      - "5555:5555"
    command: ["sh", "-c", "npx prisma generate && npx prisma studio --port 5555 --browser none"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
      - frontend_kit:/app/.svelte-kit
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_modules:
  backend_generated:
  db_data:
  frontend_modules:
  frontend_kit:
